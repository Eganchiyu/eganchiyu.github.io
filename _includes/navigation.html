<nav class="navbar">
  <div class="container">
    <a href="{{ '/' | relative_url }}" class="logo">
      <span class="logo-icon">🏠</span>
      <span class="logo-text">{{ site.title | split: "的" | first }}</span>
    </a>
    
    <div class="nav-right">
      <div class="nav-links">
        <a href="{{ '/' | relative_url }}" class="nav-link{% if page.url == '/' %} active{% endif %}">首页</a>
        <a href="{{ '/categories/' | relative_url }}" class="nav-link{% if page.url == '/categories/' %} active{% endif %}">分类</a>
        <a href="{{ '/tags/' | relative_url }}" class="nav-link{% if page.url == '/tags/' %} active{% endif %}">标签</a>
        <a href="{{ '/year-archive/' | relative_url }}" class="nav-link{% if page.url == '/year-archive/' %} active{% endif %}">归档</a>
        <a href="https://github.com/Eganchiyu" target="_blank" rel="noopener" class="nav-link">GitHub</a>
      </div>
      
      <button class="search-toggle" id="searchToggle" aria-label="搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
      </button>
      
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <span class="icon-moon">🌙</span>
        <span class="icon-sun">☀️</span>
      </button>
      
      <button class="menu-toggle" id="menuToggle" aria-label="菜单">
        ☰
      </button>
    </div>
  </div>
</nav>

<!-- Mobile Menu -->
<div class="mobile-overlay" id="mobileOverlay"></div>
<div class="mobile-menu" id="mobileMenu">
  <a href="{{ '/' | relative_url }}" class="mobile-link">🏠 首页</a>
  <a href="{{ '/categories/' | relative_url }}" class="mobile-link">📁 分类</a>
  <a href="{{ '/tags/' | relative_url }}" class="mobile-link">🏷️ 标签</a>
  <a href="{{ '/year-archive/' | relative_url }}" class="mobile-link">📅 归档</a>
  <a href="https://github.com/Eganchiyu" target="_blank" rel="noopener" class="mobile-link">🐙 GitHub</a>
</div>
