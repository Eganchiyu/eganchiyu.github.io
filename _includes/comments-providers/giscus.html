<div id="giscus-comments" class="giscus-comments"></div>
<script>
  'use strict';

  (function () {
    var commentContainer = document.querySelector('#giscus-comments');
    if (!commentContainer) return;

    var currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
    var giscusTheme = currentTheme === 'dark' ? 'dark' : 'light';

    var script = document.createElement('script');
    script.setAttribute('src', 'https://giscus.app/client.js');
    script.setAttribute('data-repo', 'Eganchiyu/eganchiyu.github.io');
    script.setAttribute('data-repo-id', 'R_kgDOQoT8Zg');
    script.setAttribute('data-category', 'Comments');
    script.setAttribute('data-category-id', 'DIC_kwDOQoT8Zs4C0q92');
    script.setAttribute('data-mapping', 'title');
    script.setAttribute('data-strict', '0');
    script.setAttribute('data-reactions-enabled', '1');
    script.setAttribute('data-emit-metadata', '0');
    script.setAttribute('data-input-position', 'top');
    script.setAttribute('data-theme', giscusTheme);
    script.setAttribute('data-lang', 'zh-CN');
    script.setAttribute('data-loading', 'lazy');
    script.setAttribute('crossorigin', 'anonymous');
    script.setAttribute('async', '');

    commentContainer.appendChild(script);
  })();
</script>
