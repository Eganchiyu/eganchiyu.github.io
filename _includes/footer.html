<footer class="footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-info">
        <p class="footer-title">{{ site.title }}</p>
        <p class="footer-subtitle">{{ site.subtitle }}</p>
      </div>

      {% if site.friends.size > 0 %}
      <div class="footer-friends">
        <p class="footer-friends-title">友情链接</p>
        <div class="footer-friends-links">
          {% for friend in site.friends %}
          <a href="{{ friend.url }}" target="_blank" rel="noopener">{{ friend.label }}</a>
          {% endfor %}
        </div>
      </div>
      {% endif %}

      <div class="footer-links">
        <a href="https://github.com/Eganchiyu" target="_blank" rel="noopener">GitHub</a>
        <a href="mailto:{{ site.author.email }}">邮箱</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </div>

      <div class="footer-copyright">
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}.
           Powered by <a href="https://jekyllrb.com" target="_blank" rel="noopener">Jekyll</a>.
        </p>
      </div>
    </div>
  </div>
</footer>
