# Jekyll 配置
# 文档: https://mmistakes.github.io/minimal-mistakes/docs/configuration/

# 主题
remote_theme           : "mmistakes/minimal-mistakes"
minimal_mistakes_skin    : "contrast"

collections:
  posts:
    output: true
    sort_by: date
    order: descending

# 站点设置
