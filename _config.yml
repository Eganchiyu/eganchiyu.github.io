# Jekyll 配置 - 现代化自定义主题
# 文档: https://jekyllrb.com/docs/configuration/

# 站点设置
locale                   : "zh-CN"
title                    : "Eganchiyu的Github Pages"
subtitle                 : "学习 · 记录 · 随想"
name                     : "Eganchiyu"
description              : "开始搭建一个基于Github Pages的静态个人网站，可能用于记录想法和学习心得，或者跟进项目动态，或者单纯用来发电。"
url                      : "https://eganchiyu.github.io/"
baseurl                  :
encoding                 : "utf-8"

# 构建
markdown                 : kramdown
highlighter              : rouge
lsi                      : false
excerpt_separator        : "\n\n"
incremental              : false

# Markdown 处理
kramdown:
  input                  : GFM
  math_engine            : mathjax
  hard_wrap              : false
  auto_ids               : true
  footnote_nr            : 1
  entity_output          : as_char
  toc_levels             : 1..6
  smart_quotes           : lsquo,rsquo,ldquo,rdquo
  enable_coderay         : false

# Sass/SCSS
sass:
  sass_dir               : _sass
  style                  : compressed

# 输出
permalink                : /:categories/:year/:month/:day/:title/

# 分页
paginate                 : 10
paginate_path            : /page:num/

# 集合
collections:
  posts:
    output               : true
    sort_by              : date
    order                : descending

# 插件
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# 文件读取
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - /docs
  - /test
keep_files:
  - .git
  - .svn

# 默认值
defaults:
  - scope:
      path              : ""
      type              : posts
    values:
      layout            : single
      author_profile    : true
      read_time         : true
      comments          : true
      share             : true

# 站点作者
author:
  name                    : "Eganchiyu"
  avatar                  : "/assets/images/avatar.png"
  location                : "西安"
  email                   : "eganchiyu@163.com"
  links:
    - label              : "GitHub"
      icon               : "fab fa-fw fa-github"
      url                : "https://github.com/Eganchiyu"
    - label              : "个人网站"
      icon               : "fas fa-fw fa-link"
      url                : "https://eganchiyu.github.io/"

# 友链
friends:
  - label                : "Kevin-WWK 友链"
    url                  : "https://wk239.com/"
  - label                : "小辰 友链"
    url                  : "https://www.240829.xyz/"
  - label                : "临雀 友链"
    url                  : "https://www.sparrived.xyz/"

# 归档
category_archive:
  type                    : liquid
  path                    : /categories/
tag_archive:
  type                    : liquid
  path                    : /tags/

# HTML 压缩
compress_html:
  clippings               : all
  ignore:
    envs                  : development
