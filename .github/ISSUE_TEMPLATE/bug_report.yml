name: 🐛 Bug 报告
description: 报告博客网站的问题，如页面显示异常、深色模式问题、移动端适配等
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间报告问题！请尽量填写以下信息，以便我更快地定位和修复问题。

  - type: dropdown
    id: bug-type
    attributes:
      label: 问题类型
      description: 请选择最符合的问题类型
      options:
        - 页面显示异常
        - 深色模式问题
        - 移动端适配问题
        - 导航/链接错误
        - 加载性能问题
        - 代码高亮问题
        - 图片显示问题
        - 搜索功能异常
        - 其他
    validations:
      required: true

  - type: input
    id: page-url
    attributes:
      label: 问题页面
      description: 请提供出现问题的页面 URL
      placeholder: "https://eganchiyu.github.io/..."
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请详细描述你遇到的问题
      placeholder: 描述你看到的问题现象...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 请描述你期望的正确行为
      placeholder: 我期望看到...
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请描述如何复现这个问题
      placeholder: |
        1. 打开页面 ...
        2. 点击 ...
        3. 滚动到 ...
        4. 看到问题 ...
    validations:
      required: false

  - type: dropdown
    id: browser
    attributes:
      label: 浏览器
      description: 你使用的浏览器
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - 其他
    validations:
      required: true

  - type: input
    id: browser-version
    attributes:
      label: 浏览器版本
      description: 浏览器版本号
      placeholder: "例如: 120.0.6099.109"
    validations:
      required: false

  - type: dropdown
    id: device
    attributes:
      label: 设备类型
      description: 你使用的设备类型
      options:
        - 桌面端 (Windows)
        - 桌面端 (macOS)
        - 桌面端 (Linux)
        - 移动端 (Android)
        - 移动端 (iOS)
        - 平板
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: 截图
      description: 如果可以的话，请提供问题截图
      placeholder: 拖拽图片到此处上传
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他你认为有助于解决问题的信息
    validations:
      required: false
